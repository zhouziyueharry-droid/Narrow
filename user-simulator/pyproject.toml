[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational-shopping-user-simulator"
version = "0.3.0"
description = "Reproducible conversational shopping user simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
user-simulator = "user_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
