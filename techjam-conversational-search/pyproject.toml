[project]
name = "techjam-shopping-agent"
version = "0.1.0"
description = "Conversational product retrieval agent for the TechJam challenge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents>=0.5.3,<1",
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1,<2"]
anthropic = ["langchain-anthropic>=1,<2"]
deepseek = ["openai>=1,<3"]
retrieval = [
    "faiss-cpu>=1.9,<2",
    "numpy>=1.26,<3",
    "sentence-transformers>=5,<6",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4,<1",
    "pytest>=8.4,<9",
    # Used by scripts/fit_precise_reranker_weights.py to fit
    # PreciseReranker's DEFAULT_WEIGHTS from evaluator sessions instead of
    # hand-tuning them (see docs/precise_reranker_change_report.md).
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_agent"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
